[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recyclevision"
version = "0.1.0"
description = "Garbage image classification using deep learning"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.50,<2", "Pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]
