[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-investment-advisor"
version = "0.1.0"
description = "Property dataset analysis and investment modelling project"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.50,<2", "pandas>=2.0,<4"]

[tool.setuptools.packages.find]
where = ["src"]
